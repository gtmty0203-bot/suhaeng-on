<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수행ON - Supabase CORS 2차 테스트</title>
<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f8ff;padding:20px;color:#17233d}
.card{max-width:760px;margin:20px auto;background:#fff;padding:22px;border-radius:16px}
.row{padding:16px 0;border-bottom:1px solid #e8edf5}
.ok{color:#16833b;font-weight:700}.bad{color:#c62828;font-weight:700}
pre{white-space:pre-wrap;background:#f7f9fd;padding:10px;border-radius:8px;overflow:auto}
</style>
</head>
<body>
<div class="card">
<h1>수행ON Supabase CORS 2차 테스트</h1>
<p>로그인 정보는 입력하지 않습니다.</p>
<div id="result">테스트 중...</div>
</div>
<script src="./supabase-config.js"></script>
<script>
(async function(){
 const box=document.getElementById('result'), rows=[];
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function add(name,ok,text){rows.push(`<div class="row"><b>${esc(name)}</b><br><span class="${ok?'ok':'bad'}">${ok?'정상':'실패'}</span><pre>${esc(text)}</pre></div>`);box.innerHTML=rows.join('')}
 const base=window.SUPABASE_URL, key=window.SUPABASE_PUBLISHABLE_KEY;
 add('Supabase 설정',!!base&&!!key,base||'설정 없음');

 // 테스트 1: apikey를 URL에 넣고 헤더는 사용하지 않음
 try{
   const url=base+'/rest/v1/?apikey='+encodeURIComponent(key);
   const r=await fetch(url,{method:'GET'});
   const t=await r.text();
   add('A. URL 방식 apikey 요청',true,'HTTP '+r.status+'\n'+t);
 }catch(e){add('A. URL 방식 apikey 요청',false,e?.message||String(e))}

 // 테스트 2: 브라우저가 요청 자체를 보낼 수 있는지 확인하기 위해 health 엔드포인트를 fetch
 try{
   const r=await fetch(base+'/auth/v1/health');
   const t=await r.text();
   add('B. Auth health fetch (키 없음)',true,'HTTP '+r.status+'\n'+t);
 }catch(e){add('B. Auth health fetch (키 없음)',false,e?.message||String(e))}
})();
</script>
</body>
</html>
