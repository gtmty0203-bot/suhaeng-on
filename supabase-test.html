<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수행ON - Supabase 연결 테스트</title>
<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f8ff;padding:24px;color:#17233d}
.card{max-width:700px;margin:30px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 6px 24px #294f8510}
h1{margin-top:0}.row{padding:12px 0;border-bottom:1px solid #e8edf5}
.ok{color:#16833b;font-weight:700}.bad{color:#c62828;font-weight:700}
button{padding:12px 18px;border:0;border-radius:10px;background:#1769e8;color:#fff;font-weight:700}
pre{white-space:pre-wrap;background:#f7f9fd;padding:12px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h1>수행ON 연결 테스트</h1>
<p>이 페이지는 수행ON의 Supabase 연결만 확인합니다.</p>
<div id="result">테스트 중...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
(async function(){
  const box=document.getElementById('result');
  const lines=[];

  function add(label, ok, detail){
    lines.push(`<div class="row"><b>${label}</b><br><span class="${ok?'ok':'bad'}">${ok?'정상':'실패'}</span>${detail?`<pre>${String(detail).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</pre>`:''}</div>`);
    box.innerHTML=lines.join('');
  }

  try{
    if(!window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY){
      add('1. Supabase 설정 읽기',false,'SUPABASE_URL 또는 Publishable Key가 없습니다.');
      return;
    }
    add('1. Supabase 설정 읽기',true,window.SUPABASE_URL);

    const response=await fetch(window.SUPABASE_URL+'/auth/v1/settings',{
      method:'GET',
      headers:{'apikey':window.SUPABASE_PUBLISHABLE_KEY}
    });

    const text=await response.text();
    if(response.ok){
      add('2. Supabase Auth 서버 연결',true,'HTTP '+response.status+'\n'+text);
    }else{
      add('2. Supabase Auth 서버 연결',false,'HTTP '+response.status+'\n'+text);
    }
  }catch(e){
    add('2. Supabase Auth 서버 연결',false,(e&&e.message)||String(e));
  }
})();
</script>
</body>
</html>
