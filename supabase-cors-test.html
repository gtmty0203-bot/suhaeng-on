<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수행ON - Supabase 요청 테스트</title>
<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f8ff;padding:20px;color:#17233d}
.card{max-width:760px;margin:20px auto;background:#fff;padding:22px;border-radius:16px}
.row{padding:14px 0;border-bottom:1px solid #e8edf5}
.ok{color:#16833b;font-weight:700}.bad{color:#c62828;font-weight:700}
pre{white-space:pre-wrap;background:#f7f9fd;padding:10px;border-radius:8px;overflow:auto}
</style>
</head>
<body>
<div class="card">
<h1>수행ON Supabase 요청 테스트</h1>
<p>로그인 정보는 입력하지 않습니다.</p>
<div id="result">테스트 중...</div>
</div>
<script src="./supabase-config.js"></script>
<script>
(async function(){
 const box=document.getElementById('result');
 const rows=[];
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function add(name,ok,text){
   rows.push(`<div class="row"><b>${esc(name)}</b><br><span class="${ok?'ok':'bad'}">${ok?'정상':'실패'}</span>${text?`<pre>${esc(text)}</pre>`:''}</div>`);
   box.innerHTML=rows.join('');
 }
 const base=window.SUPABASE_URL;
 if(!base){add('설정',false,'Supabase URL이 없습니다.');return}
 add('Supabase 주소',true,base);

 try{
   const r=await fetch(base+'/auth/v1/settings');
   const t=await r.text();
   add('A. API 키 없이 Auth 요청',true,'HTTP '+r.status+'\n'+t);
 }catch(e){
   add('A. API 키 없이 Auth 요청',false,(e&&e.message)||String(e));
 }

 try{
   const r=await fetch(base+'/auth/v1/settings',{
     headers:{'apikey':window.SUPABASE_PUBLISHABLE_KEY}
   });
   const t=await r.text();
   add('B. Publishable Key 포함 Auth 요청',true,'HTTP '+r.status+'\n'+t);
 }catch(e){
   add('B. Publishable Key 포함 Auth 요청',false,(e&&e.message)||String(e));
 }
})();
</script>
</body>
</html>
