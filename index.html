<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수행ON — 수행평가 캘린더</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f8ff;color:#17233d}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}.side{width:230px;background:#fff;border-right:1px solid #e5ebf5;padding:26px 18px;position:sticky;top:0;height:100vh}
.logo{font-size:27px;font-weight:800;color:#1769e8;margin:4px 12px 30px}.logo span{color:#15213a}
.nav button{width:100%;text-align:left;background:white;padding:14px 16px;border-radius:12px;margin:4px 0;color:#33415f;font-weight:700}.nav button.active,.nav button:hover{background:#e8f1ff;color:#1769e8}
.main{flex:1;padding:30px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.sub{color:#71809d;margin-top:8px}.pill{padding:9px 14px;border-radius:20px;background:#e9f2ff;color:#1769e8;font-weight:700}
.grid{display:grid;grid-template-columns:minmax(600px,2fr) minmax(310px,1fr);gap:20px}.card{background:#fff;border:1px solid #e4eaf4;border-radius:18px;padding:20px;box-shadow:0 6px 24px #294f8510}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.calendar-head h2{margin:0}.monthbtn{width:38px;height:38px;border-radius:50%;background:#f0f4fb}.add{background:#1769e8;color:#fff;padding:11px 16px;border-radius:10px;font-weight:800}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{padding:10px;text-align:center;color:#6d7b96;font-weight:700}.days{border-top:1px solid #edf1f7;border-left:1px solid #edf1f7}.day{min-height:105px;border-right:1px solid #edf1f7;border-bottom:1px solid #edf1f7;padding:9px}.date{font-weight:800;margin-bottom:7px}.muted{color:#b8c0cf}.today{background:#edf5ff}.events{display:flex;flex-direction:column;gap:5px}.event{padding:6px 7px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kor{background:#ffe7ed;color:#c43d59}.math{background:#e2f7ec;color:#178a5b}.eng{background:#eee5ff;color:#7042ce}.soc{background:#fff0d5;color:#a66a00}.sci{background:#e2edff;color:#2866c9}.other{background:#e4f7f7;color:#147f80}
.sidecard h3{margin:0 0 16px}.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f7;align-items:center}.subject{width:52px;text-align:center;padding:7px 4px;border-radius:15px;font-size:12px;font-weight:800}.item strong{display:block}.item small{color:#7d89a0}.d{margin-left:auto;font-weight:800;color:#1769e8}.detail{margin-top:20px}.detail .row{display:flex;gap:12px;padding:8px 0}.label{width:70px;color:#71809d;font-weight:700}.prep{margin-top:8px;padding:12px;background:#f7f9fd;border-radius:10px}.modal{display:none;position:fixed;inset:0;background:#15213a66;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;width:min(560px,100%);border-radius:18px;padding:24px}.modalbox h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d9e0ec;border-radius:10px}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.cancel{background:#eef2f7;padding:11px 15px;border-radius:10px}.save{background:#1769e8;color:#fff;padding:11px 15px;border-radius:10px}.notice{padding:12px 14px;background:#fff8df;border:1px solid #f3df9a;border-radius:12px;color:#765d00;margin-bottom:18px;font-size:14px}
@media(max-width:900px){.side{width:75px;padding:15px 8px}.logo{font-size:0;text-align:center}.logo:after{content:"ON";font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:24px}.main{padding:18px}.grid{grid-template-columns:1fr}.day{min-height:80px}.event{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo"><span>수행</span>ON</div>
  <div class="nav">
    <button class="active" onclick="showTab('calendar')">📅 달력</button>
    <button onclick="showTab('list')">📋 수행평가 목록</button>
    <button onclick="showTab('guide')">📚 준비·암기</button>
    <button onclick="showAdmin()">⚙️ 관리자</button>
  </div>
</aside>
<main class="main">
  <div class="top">
    <div><h1>수행평가를 한눈에 확인하세요</h1><div class="sub">언제 무엇을 준비해야 하는지 놓치지 않도록 정리했습니다.</div></div>
    <div style="display:flex;gap:8px;align-items:center">
<button class="pill" onclick="enableNotifications()">🔔 하루 전 알림 켜기</button>
<div class="pill" id="countPill">이번 달 6개</div>
</div>
  </div>
  <div id="notice"></div>
  <section id="calendarTab" class="grid">
    <div class="card">
      <div class="calendar-head">
        <div><button class="monthbtn" onclick="changeMonth(-1)">‹</button> <button class="monthbtn" onclick="changeMonth(1)">›</button> <h2 id="month" style="display:inline-block;margin-left:10px"></h2></div>
        <button class="add" onclick="openModal()">＋ 수행평가 추가</button>
      </div>
      <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div id="days" class="days"></div>
    </div>
    <div>
      <div class="card"><h3>다가오는 수행평가</h3><div id="upcoming"></div></div>
      <div class="card detail"><h3>선택한 수행평가</h3><div id="detail">달력에서 수행평가를 눌러보세요.</div></div>
    </div>
  </section>
  <section id="listTab" class="card" style="display:none"><h2>수행평가 목록</h2><div id="allList"></div></section>
  <section id="guideTab" class="card" style="display:none"><h2>📚 무엇을 준비해야 하나요?</h2><p class="sub">관리자가 입력한 '외울 것'과 '준비물'을 수행평가별로 확인할 수 있습니다.</p><div id="guideList"></div></section>
</main>
</div>

<div class="modal" id="modal">
<div class="modalbox">
<h2>수행평가 추가</h2>
<div class="field"><label>과목</label><select id="subject"><option>국어</option><option>수학</option><option>영어</option><option>사회</option><option>과학</option><option>기타</option></select></div>
<div class="field"><label>제목</label><input id="title" placeholder="예: 영어 발표 평가"></div>
<div class="field"><label>날짜</label><input id="date" type="date"></div>
<div class="field"><label>내용</label><textarea id="content" placeholder="수행평가에서 해야 할 내용을 적어주세요."></textarea></div>
<div class="field"><label>외워야 할 것</label><textarea id="memorize" placeholder="예: 발표문 1~3쪽, 핵심 단어 20개"></textarea></div>
<div class="field"><label>준비물</label><input id="prepare" placeholder="예: 필기구, 발표 자료"></div>
<div class="field"><label><input id="reminder" type="checkbox" checked style="width:auto"> 제출 하루 전 알림</label></div>
<div class="actions"><button class="cancel" onclick="closeModal()">취소</button><button class="save" onclick="saveEvent()">저장</button></div>
</div></div>

<script>
const key='suhaeng_on_events';
let events=JSON.parse(localStorage.getItem(key)||'null')||[
 {id:1,subject:'국어',title:'독서 감상문 작성',date:'2025-09-02',content:'지정 도서를 읽고 감상문을 작성합니다.',memorize:'작품의 핵심 내용과 인상 깊은 부분',prepare:'도서, 노트, 필기구'},
 {id:2,subject:'수학',title:'수학 탐구 보고서',date:'2025-09-05',content:'수학 관련 주제를 정해 탐구 보고서를 제출합니다.',memorize:'탐구 과정과 주요 개념',prepare:'보고서'},
 {id:3,subject:'영어',title:'발표 자료 준비',date:'2025-09-08',content:'영어 발표 자료를 준비합니다.',memorize:'발표문 핵심 문장',prepare:'발표 자료'},
 {id:4,subject:'사회',title:'조사 보고서 제출',date:'2025-09-11',content:'조사 결과를 보고서로 정리합니다.',memorize:'주요 개념 5개',prepare:'보고서, 필기구'},
 {id:5,subject:'과학',title:'실험 보고서 제출',date:'2025-09-16',content:'실험 결과와 해석을 작성합니다.',memorize:'실험 원리와 결론',prepare:'실험 기록지'},
 {id:6,subject:'국어',title:'발표 평가',date:'2025-09-23',content:'준비한 주제로 발표합니다.',memorize:'발표문',prepare:'발표 자료'}
];
let view=new Date(2025,8,1), selected=null;
const cls=s=>({국어:'kor',수학:'math',영어:'eng',사회:'soc',과학:'sci'}[s]||'other');
function render(){
 document.getElementById('month').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;
 const first=new Date(view.getFullYear(),view.getMonth(),1).getDay(), last=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
 let h='';
 for(let i=0;i<first;i++)h+='<div class="day"></div>';
 for(let d=1;d<=last;d++){
  const ds=`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const es=events.filter(e=>e.date===ds);
  h+=`<div class="day"><div class="date">${d}</div><div class="events">${es.map(e=>`<div class="event ${cls(e.subject)}" onclick="selectEvent(${e.id})">${e.subject} · ${e.title}</div>`).join('')}</div></div>`;
 }
 document.getElementById('days').innerHTML=h;
 const sorted=[...events].sort((a,b)=>a.date.localeCompare(b.date));
 document.getElementById('upcoming').innerHTML=sorted.slice(0,7).map(e=>itemHTML(e)).join('')||'등록된 수행평가가 없습니다.';
 document.getElementById('allList').innerHTML=sorted.map(e=>itemHTML(e,true)).join('');
 document.getElementById('guideList').innerHTML=sorted.map(e=>`<div class="item"><span class="subject ${cls(e.subject)}">${e.subject}</span><div><strong>${e.title}</strong><small>📅 ${e.date}<br>🧠 외울 것: ${e.memorize||'입력된 내용 없음'}<br>🎒 준비물: ${e.prepare||'입력된 내용 없음'}</small></div></div>`).join('');
 document.getElementById('countPill').textContent=`이번 달 ${events.filter(e=>new Date(e.date).getMonth()===view.getMonth()&&new Date(e.date).getFullYear()===view.getFullYear()).length}개`;
}
function itemHTML(e){return `<div class="item" onclick="selectEvent(${e.id})"><span class="subject ${cls(e.subject)}">${e.subject}</span><div><strong>${e.title}</strong><small>${e.date}</small></div></div>`}
function selectEvent(id){selected=events.find(e=>e.id===id);document.getElementById('detail').innerHTML=`<div><span class="subject ${cls(selected.subject)}">${selected.subject}</span><h3>${selected.title}</h3><div class="row"><span class="label">제출일</span><b>${selected.date}</b></div><div class="row"><span class="label">내용</span><span>${selected.content||'-'}</span></div><div class="prep">🧠 <b>외워야 할 것</b><br>${selected.memorize||'입력된 내용 없음'}<br><br>🎒 <b>준비물</b><br>${selected.prepare||'입력된 내용 없음'}</div></div>`}
function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
function showTab(t){['calendar','list','guide'].forEach(x=>document.getElementById(x+'Tab').style.display=x===t?'grid':'none')}
function showAdmin(){document.getElementById('notice').innerHTML='<div class="notice">관리자 입력 기능은 현재 <b>이 브라우저에서 테스트하는 1차 버전</b>입니다. 실제로 여러 사람이 같은 데이터를 보려면 다음 단계에서 데이터베이스를 연결하면 됩니다.</div>';showTab('calendar')}
function openModal(){document.getElementById('modal').classList.add('show');document.getElementById('date').value=new Date().toISOString().slice(0,10)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveEvent(){
 const e={id:Date.now(),subject:subject.value,title:title.value.trim(),date:date.value,content:content.value.trim(),memorize:memorize.value.trim(),prepare:prepare.value.trim(),reminder:document.getElementById('reminder').checked};
 if(!e.title||!e.date){alert('제목과 날짜를 입력해주세요.');return}
 events.push(e);localStorage.setItem(key,JSON.stringify(events));closeModal();['title','content','memorize','prepare'].forEach(id=>document.getElementById(id).value='');
async function enableNotifications(){
  if(!('Notification' in window)){alert('이 브라우저에서는 알림 기능을 지원하지 않습니다.');return}
  const p=await Notification.requestPermission();
  if(p==='granted'){
    localStorage.setItem('notifications_enabled','1');
    checkReminders();
    alert('알림이 켜졌습니다. 사이트를 열어두면 제출 하루 전 알림을 확인할 수 있습니다.');
  }else alert('알림 권한이 허용되지 않았습니다.');
}
function checkReminders(){
  if(Notification.permission!=='granted') return;
  const now=new Date();
  const tomorrow=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const ds=tomorrow.toISOString().slice(0,10);
  events.filter(e=>e.date===ds && e.reminder!==false).forEach(e=>{
    const k='notified_'+e.id+'_'+ds;
    if(!localStorage.getItem(k)){
      new Notification('수행ON — 내일 수행평가', {body:`${e.subject} · ${e.title}\n🧠 ${e.memorize||'외울 것 확인하기'}\n🎒 ${e.prepare||'준비물 확인하기'}`});
      localStorage.setItem(k,'1');
    }
  });
}
setInterval(checkReminders,60000);

render();
checkReminders();selectEvent(e.id)
}
render();
</script>
</body>
</html>
